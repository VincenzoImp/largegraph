name: checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra images --extra leiden --extra validation
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check src tests
      - run: uv run --no-sync pytest -q -m "not browser"
      - run: uv run --no-sync largegraph demo --output runs/ci-demo --images
      - run: uv run --no-sync largegraph verify runs/ci-demo --deep
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-${{ matrix.os }}-${{ matrix.python }}
          path: runs/ci-demo/report
  browser-and-package:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.checksums.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra images --extra leiden --extra validation --group browser
      - run: uv run --no-sync mypy
      - run: uv run --no-sync playwright install --with-deps chromium
      - run: uv run --no-sync pytest -q -m browser
      - run: uv build
      - run: uv run --no-sync twine check --strict dist/*
      - name: Install the base wheel in a clean environment
        run: |
          uv venv /tmp/largegraph-wheel --python 3.12
          uv pip install --python /tmp/largegraph-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/largegraph-wheel/bin/largegraph demo --output packaged-demo
          /tmp/largegraph-wheel/bin/largegraph verify packaged-demo --deep
      - name: Record the distributions' checksums
        id: checksums
        run: |
          {
            echo "sha256<<EOF"
            (cd dist && sha256sum *.whl *.tar.gz)
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
  # A second job, as in the publish workflow: an artifact is not always listed
  # in the seconds after its upload, and a re-run would read an earlier attempt's.
  package-roundtrip:
    needs: browser-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - name: Verify distribution upload and download preserve every byte
        working-directory: dist
        env:
          SHA256: ${{ needs.browser-and-package.outputs.sha256 }}
        run: |
          test "$(ls | wc -l)" -eq 2
          sha256sum --check --strict <<< "$SHA256"
